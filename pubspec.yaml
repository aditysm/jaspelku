name: jaspelku
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get: ^4.7.2
  get_storage: ^2.1.1
  svg_flutter: ^0.0.1
  persistent_bottom_nav_bar: ^6.2.1
  bottom_navy_bar: ^6.1.0
  intl: ^0.20.2
  timeago: ^3.2.2
  file_picker: ^10.1.2
  image_picker: ^1.1.2
  video_player: ^2.9.5
  path_provider: ^2.1.5
  media_kit: ^1.2.0
  media_kit_video: ^1.3.0
  badges: ^3.1.2
  webview_flutter: ^4.10.0
  flutter_launcher_icons: ^0.14.3
  permission_handler: ^12.0.0+1
  location: ^7.0.1
  package_info_plus: ^8.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter_lints: ^5.0.0

flutter_launcher_icons:
  android: "launcher_icon"
  image_path: assets/logo/launcher.png
  ios: true
  
flutter:
  assets:
  - assets/
  - assets/logo/
  - assets/icon/
  - assets/logo/intro-1.jpg
  - assets/logo/intro-2.jpg
  - assets/logo/intro-3.jpg
  - assets/logo/intro-4.jpg
  uses-material-design: true
